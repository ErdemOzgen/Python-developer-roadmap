[project]
name = "starter-backend"
version = "0.1.0"
description = "Week 1 starter backend scaffold for the Python Backend Roadmap 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.33.0",
  "pydantic-settings>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "httpx>=0.28.0",
  "ruff>=0.12.0",
  "mypy>=1.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
mypy_path = "src"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
